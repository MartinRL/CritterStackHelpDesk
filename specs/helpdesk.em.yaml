# Helpdesk — Event-Modeling spec, reverse-engineered from the running Critter Stack
# code (Helpdesk.Api). This spec is the intended single source of truth the C# domain
# maps to 1:1. Syntax per emlang YAML (Emlang.Cli); conventions borrowed from
# kvissig.se/specs/CLAUDE.md.
#
# Conventions (emlang decider dialect 1.1.0, em 0.4.0):
#   initiators carry the role + originating screen
#     a:    actor        (🧑 Customer / Incident form, 🧑‍💼 Agent / Incident details)
#     auto: automation   (⚙️ System / ...) — the Event-Modeling PROCESSOR gear
#   commands are bare              (LogIncident, CategoriseIncident)
#   events carry the stream        (Incident / IncidentLogged)
#   exceptions are bare            (UnknownCustomer)
#   screen views are bare data nouns (v: Incident details); the decider's decision
#   model is the state element     (s: Incident)
#
# DECIDER GWT RULE: decide(state, command) -> events. Every ✍️ test gives exactly ONE
# state, s: Incident, and nothing else. Reference data (Customer directory,
# Customer priorities) is resolved by the shell / the gear and reaches decide as
# command props, never as a second given. The creation given is the EMPTY state
# (s: Incident with no props = the query matched no events); the code side folds it
# as Incident.Initial / status NotLogged. Evolve is tested by the fold tests in
# 👀 Decision Model (given events, then s: Incident); every event a decision emits
# must be folded by one of them (em-then-outside-query).
#
# Slice-name emoji: ✍️ state-change (writes the stream), 👀 state view (screens +
# decider State). Automations are the Event-Modeling PROCESSOR pattern:
#   event(s) -> read-model -> auto: ⚙️ System (the gear) -> command -> event(s)
#
# WIRE COMPATIBILITY: event names and props are EXACTLY the records in
# Helpdesk.Api/Incident.cs — British spelling included (IncidentCategorised,
# IncidentPrioritised) — so the generated domain replays the existing Marten streams.
# Props are camelCase (the C# records PascalCase them; System.Text.Json default maps 1:1).
#
# Actor identity is CLAIM-SOURCED: loggedBy / userId / agentId / resolvedBy /
# acknowledgedBy / closedBy come from the "user-id" claim via UserDetectionMiddleware
# (Helpdesk.Api/UserDetectionMiddleware.cs), never from command props. Stated once here;
# x: NoValidUser (missing/invalid claim) is listed only on the first slice and applies
# to every command slice.
#
# Prop types (these annotations ARE the intended C# types):
#   ids            Guid            (incidentId, customerId, loggedBy, userId, agentId,
#                                   resolvedBy, acknowledgedBy, closedBy)
#   timestamps     DateTimeOffset  (*At)
#   category       IncidentCategory (Software|Hardware|Network|Database)   — enum
#   priority       IncidentPriority (Critical|High|Medium|Low)             — enum
#   resolution     ResolutionType  (Temporary|Permanent|NotAnIncident)     — enum
#   status         IncidentStatus  (NotLogged|Pending|Resolved|ResolutionAcknowledgedByCustomer|Closed)
#                                   NotLogged = the empty-stream sentinel (Incident.Initial)
#   contact        Contact { contactChannel: ContactChannel (Email|Phone|InPerson|GeneratedBySystem), firstName?: string, lastName?: string, emailAddress?: string, phoneNumber?: string }
#   notes          IncidentNote[]  { type: IncidentNoteType (FromAgent|FromCustomer), from: Guid, content: string, visibleToCustomer: bool }
#   version        int             (optimistic concurrency; IncidentDetails.Version)
#
# Test fixtures (referenced by name in the cases below):
#   customer1Id — a known customer (BaselineData.Customer1Id); priorities map
#                 Database -> Critical (customer1Priorities), no mapping for Network
#   martinId    — the customer user issuing LogIncident (user-id claim)
#   agentId     — the agent user (user-id claim)
#   systemId    — the System's synthetic user id (CategoriseIncidentHandler.SystemId)
#   emailContact = Contact { contactChannel: Email }

slices:

  # --- Intake ----------------------------------------------------------------

  # From LogIncidentEndpoint (LogIncident.cs): FluentValidation guards description
  # (NotEmpty) and contact (NotNull); [WolverineBefore] middleware guards the customer
  # document lookup (UnknownCustomer); UserDetectionMiddleware guards the claim
  # (NoValidUser). incidentId is MINTED by MartenOps.StartStream<Incident>.
  # Tests trace to LogIncident_handling.cs.
  ✍️ Log New Incident:
    steps:
      - a: 🧑 Customer / Incident form
      - c: LogIncident
        props:
          customerId: Guid
          contact: Contact
          description: string
      - x: NoValidUser
      - x: UnknownCustomer
      - x: DescriptionRequired
      - x: ContactRequired
      - e: Incident / IncidentLogged
        props:
          incidentId: Guid          # minted stream id (MartenOps.StartStream)
          customerId: Guid
          contact: Contact
          description: string
          loggedBy: Guid            # from the user-id claim
      - v: Incident details
    tests:
      # Creation given = the empty state (no props): the stream has no events yet. The
      # code side folds it as Incident.Initial (status NotLogged). The Customer lookup is
      # a shell dependency ([WolverineBefore] middleware, BaselineData seed) — reference
      # data, never drawn as a given.
      incident can be logged:
        given:
          - s: Incident
        when:
          - c: LogIncident
            props: { customerId: customer1Id, contact: emailContact, description: It's broken }
        then:
          - e: Incident / IncidentLogged
            props:
              incidentId: minted
              customerId: customer1Id
              contact: emailContact
              description: It's broken
              loggedBy: martinId
      cannot log incident for unknown customer:
        given:
          - s: Incident
        when:
          - c: LogIncident
            props: { customerId: unknown, contact: emailContact, description: It's broken }
        then:
          - x: UnknownCustomer
      cannot log incident without description:
        given:
          - s: Incident
        when:
          - c: LogIncident
            props: { customerId: customer1Id, contact: emailContact, description: "" }
        then:
          - x: DescriptionRequired

  # Mirrors IncidentDetails.cs — the inline SingleStreamProjection read model.
  👀 View Incident Details:
    steps:
      - v: Incident details
        props:
          incidentId: Guid
          customerId: Guid
          status: IncidentStatus (Pending|Resolved|ResolutionAcknowledgedByCustomer|Closed)
          notes: IncidentNote[]     # { type: IncidentNoteType, from: Guid, content: string, visibleToCustomer: bool }
          category: IncidentCategory?
          priority: IncidentPriority?
          agentId: Guid?
          version: int
    tests:
      new incident shows as pending with no notes:
        given:
          - e: Incident / IncidentLogged
            props: { incidentId: incident1Id, customerId: customer1Id, contact: emailContact, description: It's broken, loggedBy: martinId }
        then:
          - v: Incident details
            props:
              incidentId: incident1Id
              customerId: customer1Id
              status: Pending
              notes: []

  # --- Triage ----------------------------------------------------------------

  # From CategoriseIncidentEndpoint (CategoriseIncident.cs). WIRE NAME: the code's
  # command prop is `Id` ([Identity, JsonPropertyName("Id")]) — spec-named incidentId
  # for clarity; the generated command keeps the Id wire name. Validator guards
  # Version > 0 (InvalidVersion) and Id not empty (IncidentIdRequired).
  # Tests trace to CategoriseIncidentTests.cs + categorise_incidents_end_to_end.cs.
  ✍️ Categorise Incident:
    steps:
      - a: 🧑‍💼 Agent / Incident details
      - c: CategoriseIncident
        props:
          incidentId: Guid          # wire name "Id" in the existing API
          category: IncidentCategory (Software|Hardware|Network|Database)
          version: int              # optimistic concurrency, must be > 0
      - x: InvalidVersion
      - x: IncidentIdRequired
      - e: Incident / IncidentCategorised
        props:
          category: IncidentCategory (Software|Hardware|Network|Database)
          userId: Guid              # from the user-id claim
      - v: Incident details
    tests:
      changed category is recorded:
        given:
          - s: Incident
            props:
              incidentId: incident1Id
              status: Pending
              category: Hardware
        when:
          - c: CategoriseIncident
            props: { incidentId: incident1Id, category: Database, version: 1 }
        then:
          - e: Incident / IncidentCategorised
            props: { category: Database, userId: agentId }
      unchanged category is a no-op:
        # decide returns no events when existing.Category == command.Category
        given:
          - s: Incident
            props:
              incidentId: incident1Id
              status: Pending
              category: Database
        when:
          - c: CategoriseIncident
            props: { incidentId: incident1Id, category: Database, version: 1 }
        then: []
      cannot categorise with version zero:
        given:
          - s: Incident
            props:
              incidentId: incident1Id
              status: Pending
        when:
          - c: CategoriseIncident
            props: { incidentId: incident1Id, category: Database, version: 0 }
        then:
          - x: InvalidVersion

  # PROCESSOR: IncidentCategorised is event-forwarded to the gear
  # (IntegrateWithWolverine + SubscribeToEvent in Program.cs). The GEAR reads the
  # customer's category->priority mapping (Customer.Priorities dictionary, normalized
  # here to a CategoryPriority[] read model), resolves the priority for the event's
  # category, and issues TryAssignPriority carrying that priority. Decide sees
  # state + command only (DECIDER GWT RULE in the header).
  # Gear-side guards (not decide, so not GWTs here): no mapping for the category =>
  # the gear does not fire. An uncategorised incident cannot reach the gear because
  # the trigger is IncidentCategorised.
  # Code today (TryAssignPriorityHandler.LoadAsync + Handle(cmd, details, customer))
  # does the lookup inside the handler; it moves to the gear when the Api is rewired
  # onto the Decider. Event wire shape is unchanged.
  ✍️ Auto-Assign Priority:
    steps:
      - e: Incident / IncidentCategorised
      - v: Customer priorities
        props:
          customerId: Guid
          priorities: CategoryPriority[]   # { category: IncidentCategory, priority: IncidentPriority } — normalized from Customer.Priorities
      - auto: ⚙️ System / Assign priority
      - c: TryAssignPriority
        props:
          incidentId: Guid
          priority: IncidentPriority (Critical|High|Medium|Low)   # resolved by the gear: category -> Customer priorities
          userId: Guid              # the acting system/user identity stamped on the event
      - e: Incident / IncidentPrioritised
        props:
          priority: IncidentPriority (Critical|High|Medium|Low)
          userId: Guid
      - v: Incident details
    tests:
      customer mapping assigns the priority:
        given:
          - s: Incident
            props:
              incidentId: incident1Id
              status: Pending
              category: Database
        when:
          - c: TryAssignPriority
            props: { incidentId: incident1Id, priority: Critical, userId: systemId }
        then:
          - e: Incident / IncidentPrioritised
            props: { priority: Critical, userId: systemId }
      already-matching priority is a no-op:
        given:
          - s: Incident
            props:
              incidentId: incident1Id
              status: Pending
              category: Database
              priority: Critical    # already what the gear resolved
        when:
          - c: TryAssignPriority
            props: { incidentId: incident1Id, priority: Critical, userId: systemId }
        then: []

  👀 View Updated Incident:
    steps:
      - v: Incident details
    tests:
      triaged incident shows category and priority:
        given:
          - e: Incident / IncidentLogged
            props: { incidentId: incident1Id, customerId: customer1Id, contact: emailContact, description: It's broken, loggedBy: martinId }
          - e: Incident / IncidentCategorised
            props: { category: Database, userId: agentId }
          - e: Incident / IncidentPrioritised
            props: { priority: Critical, userId: systemId }
        then:
          - v: Incident details
            props:
              incidentId: incident1Id
              status: Pending
              category: Database
              priority: Critical

  # PROCESSOR: from TryAssignPriorityHandler — when the assigned priority is Critical,
  # RingAllTheAlarms is published as an OUTGOING MESSAGE to NotificationService
  # (RabbitMQ). The slice ends at the command: emlang has no outgoing-message element
  # and a GWT `then:` cannot carry a command, so the two branch cases are documented
  # here instead of as tests:
  #   Critical priority rings   — IncidentPrioritised(Critical) -> RingAllTheAlarms published
  #   High priority stays quiet — IncidentPrioritised(High)     -> nothing published
  # Both branches live in TryAssignPriorityHandler.Handle and are covered by the
  # Auto-Assign Priority tests' decide-path.
  ✍️ Critical Priority Alert:
    steps:
      - e: Incident / IncidentPrioritised
      - auto: ⚙️ System / Alert dispatcher
      - c: RingAllTheAlarms
        props:
          incidentId: Guid

  # --- Conversation ----------------------------------------------------------
  # The events below exist in Incident.cs and fold in the Incident aggregate, but no
  # HTTP endpoint produces them yet — commands and guards are INFERRED.

  # ASSUMPTION: inferred command; no endpoint exists. agentId comes from the user-id
  # claim. IncidentAlreadyClosed is the inferred lifecycle guard (a closed incident
  # accepts no further conversation).
  ✍️ Agent Responds:
    steps:
      - a: 🧑‍💼 Agent / Incident details
      - c: RecordAgentResponse
        props:
          incidentId: Guid
          content: string
          visibleToCustomer: bool
      - x: IncidentAlreadyClosed
      - e: Incident / AgentRespondedToIncident
        props:
          agentId: Guid             # from the user-id claim
          content: string
          visibleToCustomer: bool
      - v: Incident details
    tests:
      agent response is recorded:
        given:
          - s: Incident
            props:
              incidentId: incident1Id
              status: Pending
        when:
          - c: RecordAgentResponse
            props: { incidentId: incident1Id, content: try rebooting, visibleToCustomer: true }
        then:
          - e: Incident / AgentRespondedToIncident
            props: { agentId: agentId, content: try rebooting, visibleToCustomer: true }
      cannot respond to a closed incident:
        given:
          - s: Incident
            props:
              incidentId: incident1Id
              status: Closed
        when:
          - c: RecordAgentResponse
            props: { incidentId: incident1Id, content: try rebooting, visibleToCustomer: true }
        then:
          - x: IncidentAlreadyClosed

  # ASSUMPTION: inferred command; no endpoint exists. userId from the user-id claim.
  ✍️ Customer Responds:
    steps:
      - a: 🧑 Customer / Incident details
      - c: RecordCustomerResponse
        props:
          incidentId: Guid
          content: string
      - x: IncidentAlreadyClosed
      - e: Incident / CustomerRespondedToIncident
        props:
          userId: Guid              # from the user-id claim
          content: string
      - v: Incident details
    tests:
      customer response is recorded:
        given:
          - s: Incident
            props:
              incidentId: incident1Id
              status: Pending
        when:
          - c: RecordCustomerResponse
            props: { incidentId: incident1Id, content: still broken }
        then:
          - e: Incident / CustomerRespondedToIncident
            props: { userId: martinId, content: still broken }
      cannot respond to a closed incident:
        given:
          - s: Incident
            props:
              incidentId: incident1Id
              status: Closed
        when:
          - c: RecordCustomerResponse
            props: { incidentId: incident1Id, content: still broken }
        then:
          - x: IncidentAlreadyClosed

  # --- Resolution lifecycle --------------------------------------------------

  # ASSUMPTION: inferred command; no endpoint exists. resolvedBy from the user-id
  # claim; resolvedAt stamped by the shell.
  ✍️ Resolve Incident:
    steps:
      - a: 🧑‍💼 Agent / Incident details
      - c: ResolveIncident
        props:
          incidentId: Guid
          resolution: ResolutionType (Temporary|Permanent|NotAnIncident)
      - x: IncidentAlreadyClosed
      - e: Incident / IncidentResolved
        props:
          resolution: ResolutionType (Temporary|Permanent|NotAnIncident)
          resolvedBy: Guid          # from the user-id claim
          resolvedAt: DateTimeOffset
      - v: Incident details
    tests:
      incident can be resolved:
        given:
          - s: Incident
            props:
              incidentId: incident1Id
              status: Pending
        when:
          - c: ResolveIncident
            props: { incidentId: incident1Id, resolution: Permanent }
        then:
          - e: Incident / IncidentResolved
            props: { resolution: Permanent, resolvedBy: agentId, resolvedAt: resolvedAt }
      cannot resolve a closed incident:
        given:
          - s: Incident
            props:
              incidentId: incident1Id
              status: Closed
        when:
          - c: ResolveIncident
            props: { incidentId: incident1Id, resolution: Permanent }
        then:
          - x: IncidentAlreadyClosed

  # ASSUMPTION: inferred command; no endpoint exists. acknowledgedBy from the user-id
  # claim. IncidentNotResolved is the inferred guard: only a Resolved incident can be
  # acknowledged (IncidentStatus lifecycle order).
  ✍️ Acknowledge Resolution:
    steps:
      - a: 🧑 Customer / Incident details
      - c: AcknowledgeResolution
        props:
          incidentId: Guid
      - x: IncidentNotResolved
      - e: Incident / ResolutionAcknowledgedByCustomer
        props:
          incidentId: Guid
          acknowledgedBy: Guid      # from the user-id claim
          acknowledgedAt: DateTimeOffset
      - v: Incident details
    tests:
      resolution can be acknowledged:
        given:
          - s: Incident
            props:
              incidentId: incident1Id
              status: Resolved
        when:
          - c: AcknowledgeResolution
            props: { incidentId: incident1Id }
        then:
          - e: Incident / ResolutionAcknowledgedByCustomer
            props: { incidentId: incident1Id, acknowledgedBy: martinId, acknowledgedAt: acknowledgedAt }
      cannot acknowledge an unresolved incident:
        given:
          - s: Incident
            props:
              incidentId: incident1Id
              status: Pending
        when:
          - c: AcknowledgeResolution
            props: { incidentId: incident1Id }
        then:
          - x: IncidentNotResolved

  # ASSUMPTION: inferred command; no endpoint exists. closedBy from the user-id claim.
  # ResolutionNotAcknowledged is the inferred guard: closing requires the customer's
  # acknowledgement first (IncidentStatus lifecycle order).
  ✍️ Close Incident:
    steps:
      - a: 🧑‍💼 Agent / Incident details
      - c: CloseIncident
        props:
          incidentId: Guid
      - x: ResolutionNotAcknowledged
      - x: IncidentAlreadyClosed
      - e: Incident / IncidentClosed
        props:
          incidentId: Guid
          closedBy: Guid            # from the user-id claim
          closedAt: DateTimeOffset
      - v: Incident details
    tests:
      acknowledged incident can be closed:
        given:
          - s: Incident
            props:
              incidentId: incident1Id
              status: ResolutionAcknowledgedByCustomer
        when:
          - c: CloseIncident
            props: { incidentId: incident1Id }
        then:
          - e: Incident / IncidentClosed
            props: { incidentId: incident1Id, closedBy: agentId, closedAt: closedAt }
      cannot close before the customer acknowledges:
        given:
          - s: Incident
            props:
              incidentId: incident1Id
              status: Resolved
        when:
          - c: CloseIncident
            props: { incidentId: incident1Id }
        then:
          - x: ResolutionNotAcknowledged

  # --- Decision model (decider State) — APPENDIX, not a timeline step ---------

  # The folded IncidentState the decider's `decide` reads — referenced by the Given of
  # every command slice above. Mirrors the Incident aggregate (Incident.cs) widened
  # with the IncidentDetails props decide needs (category/priority for triage guards).
  # Fold tests are mined from IncidentAggregateTests.cs.
  # Decide always receives state; creation givens are the empty state (the code side's
  # Incident.Initial, status NotLogged). One fold test per emitted event type keeps the
  # model closed (em-then-outside-query).
  # NOTE: AgentAssignedToIncident { agentId: Guid } exists in Incident.cs and folds
  # into IncidentDetails.AgentId, but no slice produces it yet — carried here for
  # wire compatibility only.
  👀 Decision Model:
    steps:
      - s: Incident
        props:
          incidentId: Guid
          customerId: Guid
          status: IncidentStatus (NotLogged|Pending|Resolved|ResolutionAcknowledgedByCustomer|Closed)
          category: IncidentCategory?
          priority: IncidentPriority?
          agentId: Guid?
          notes: IncidentNote[]
          hasOutstandingResponseToCustomer: bool
          version: int
    tests:
      customer response flags an outstanding reply and agent response clears it:
        given:
          - e: Incident / IncidentLogged
            props: { incidentId: incident1Id, customerId: customer1Id, contact: emailContact, description: It's broken, loggedBy: martinId }
          - e: Incident / CustomerRespondedToIncident
            props: { userId: martinId, content: still broken }
          - e: Incident / AgentRespondedToIncident
            props: { agentId: agentId, content: try rebooting, visibleToCustomer: true }
        then:
          - s: Incident
            props:
              incidentId: incident1Id
              status: Pending
              hasOutstandingResponseToCustomer: false   # customer set it true, agent cleared it
      triage folds category and priority:
        given:
          - e: Incident / IncidentLogged
            props: { incidentId: incident1Id, customerId: customer1Id, contact: emailContact, description: It's broken, loggedBy: martinId }
          - e: Incident / IncidentCategorised
            props: { category: Database, userId: agentId }
          - e: Incident / IncidentPrioritised
            props: { priority: Critical, userId: systemId }
        then:
          - s: Incident
            props:
              incidentId: incident1Id
              status: Pending
              category: Database
              priority: Critical
      lifecycle folds through resolved and acknowledged to closed:
        given:
          - e: Incident / IncidentLogged
            props: { incidentId: incident1Id, customerId: customer1Id, contact: emailContact, description: It's broken, loggedBy: martinId }
          - e: Incident / IncidentResolved
            props: { resolution: Permanent, resolvedBy: agentId, resolvedAt: resolvedAt }
          - e: Incident / ResolutionAcknowledgedByCustomer
            props: { incidentId: incident1Id, acknowledgedBy: martinId, acknowledgedAt: acknowledgedAt }
          - e: Incident / IncidentClosed
            props: { incidentId: incident1Id, closedBy: agentId, closedAt: closedAt }
        then:
          - s: Incident
            props:
              incidentId: incident1Id
              status: Closed
